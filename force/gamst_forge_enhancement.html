<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감스트 대장간 - 유비 쌍고검 강화</title>
<style>
:root{
  --gold:#f6c453; --gold2:#ff9f1c; --green:#68ff91; --red:#ff4b55;
  --panel:rgba(8,10,14,.90); --line:rgba(246,196,83,.72);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",sans-serif;background:#050505;color:#fff}
body{overflow-x:hidden}
#scene{position:fixed;inset:0;background:url('forge_bg.png') center/cover no-repeat;z-index:-3}
#scene:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 52%,rgba(255,116,20,.2),transparent 28%),
 linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18) 42%,rgba(0,0,0,.58));}
.embers{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff7b00;animation:rise linear forwards}
@keyframes rise{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-260px) scale(.2);opacity:0}}
.app{width:min(1600px,100%);margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand h1{margin:0;font-size:clamp(28px,3.2vw,56px);color:#ffe0a1;text-shadow:0 0 10px #ff9a1f,0 0 28px #7e3500}
.brand p{margin:4px 0 0;color:#d9b873;font-weight:800;letter-spacing:.12em}
.balance{padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.72);font-size:18px;box-shadow:0 0 18px rgba(255,174,50,.2)}
.balance strong{color:#ffd75e;font-size:22px}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(400px,.85fr);gap:18px}
.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(16,18,23,.92),rgba(5,6,9,.94));box-shadow:0 0 0 3px rgba(246,196,83,.08),0 20px 50px rgba(0,0,0,.6),inset 0 0 28px rgba(255,150,25,.04)}
.forge{position:relative;min-height:780px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.weapon-wrap{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(690px,88%);text-align:center}
.level{font-size:clamp(38px,6vw,86px);font-weight:1000;color:#ffd66a;text-shadow:0 0 12px #ff9f1c,0 0 34px #ff5b00;margin-bottom:-28px;position:relative;z-index:5}
.weapon{width:100%;max-height:460px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(99,255,137,.78)) drop-shadow(0 0 32px rgba(255,166,36,.55));transition:.25s}
.weapon.charge{animation:charge .6s ease-in-out infinite}
.weapon.success{animation:success 1s ease-out}
.weapon.fail{animation:fail .8s ease-out}
@keyframes charge{0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(99,255,137,.65))}50%{transform:scale(1.04);filter:brightness(1.35) drop-shadow(0 0 38px #75ff9b) drop-shadow(0 0 58px #ff9f1c)}}
@keyframes success{0%{transform:scale(.9);filter:brightness(4)}45%{transform:scale(1.12);filter:brightness(2.5) drop-shadow(0 0 70px #fff)}100%{transform:scale(1)}}
@keyframes fail{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-2deg);filter:grayscale(.5)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.weapon-name{font-size:26px;font-weight:1000;color:#7dff9c;text-shadow:0 0 12px #178b3d}
.anvil{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:80%;height:110px;background:radial-gradient(ellipse at center,#ff7a00 0%,rgba(255,100,0,.35) 24%,transparent 68%);filter:blur(8px)}
.bottom-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:10;margin-top:auto}
.sub-panel{padding:12px;background:rgba(0,0,0,.75);border:1px solid rgba(246,196,83,.35);border-radius:12px;max-height:160px;overflow:auto}
.sub-panel h3{margin:0 0 6px;color:#ffd37a;font-size:14px}
.history-list{font-family:monospace;font-size:12px;line-height:1.6}
.success-txt{color:#65ff85}.fail-txt{color:#ff6b6b}

.controls{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:82vh;overflow-y:auto}
.controls h2{margin:0;color:#ffd37a;font-size:22px}
.stat{padding:10px;border:1px solid rgba(246,196,83,.28);border-radius:10px;background:rgba(0,0,0,.38)}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.stat-row strong{color:#ffd65d;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:11px;color:#cdbb95;font-weight:800}
input[type=number],select{width:100%;margin-top:3px;padding:8px;border-radius:6px;border:1px solid rgba(246,196,83,.38);background:#0d0f13;color:#fff;font-size:14px}
.btn{padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;text-align:center}
.btn-primary{background:linear-gradient(180deg,#ffb62e,#b75d00);color:#fff6d4;font-size:20px;border:2px solid #ffd66a;box-shadow:0 0 16px rgba(255,160,22,.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sub{background:#222532;color:#ffd37a;border:1px solid #b8860b;font-size:13px}
.table-wrap{max-height:220px;overflow-y:auto;border:1px solid rgba(246,196,83,.25);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
th{background:rgba(246,196,83,.15);color:#ffd37a;position:sticky;top:0}
td input{padding:4px;font-size:12px;text-align:center}
.result{min-height:50px;display:grid;place-items:center;text-align:center;border:1px solid rgba(246,196,83,.25);border-radius:10px;background:rgba(0,0,0,.4);font-size:16px;font-weight:900}
.result.good{color:#79ff9c}
.result.bad{color:#ff7777}

/* 최종 보상 팝업 모달 스타일 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,#1c1e26,#0d0f14);border:3px solid var(--gold);padding:30px;border-radius:20px;width:min(450px,90%);text-align:center;box-shadow:0 0 40px rgba(246,196,83,.4)}
.modal-box h2{color:var(--gold);margin-top:0;font-size:28px}
.modal-box p{font-size:18px;line-height:1.6;margin:20px 0}
.modal-rewards{background:rgba(0,0,0,.5);border:1px solid rgba(246,196,83,.3);border-radius:10px;padding:12px;margin-bottom:20px;max-height:150px;overflow-y:auto;text-align:left;font-size:14px}

.flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
.flash.on{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:1;background:white}22%{opacity:.9;background:#8cff9f}100%{opacity:0;background:transparent}}
.shock{position:fixed;inset:0;pointer-events:none;z-index:49}
.shock.on{animation:shock .45s ease-out}
@keyframes shock{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,3px)}80%{transform:translate(5px,-3px)}}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.forge{min-height:650px}}
</style>
</head>
<body>
<div id="scene"></div><div class="embers" id="embers"></div><div class="flash" id="flash"></div><div class="shock" id="shock"></div>

<!-- 최종 보상 팝업 모달 -->
<div id="rewardModal" class="modal-overlay">
  <div class="modal-box">
    <h2>🎉 도전 종료 및 보상 정산</h2>
    <p id="modalMsg">도전이 종료되었습니다!</p>
    <div style="font-size:13px;color:#ffd37a;margin-bottom:6px;text-align:left;">획득한 상품 리스트:</div>
    <div id="modalRewardsList" class="modal-rewards"></div>
    <button id="modalConfirmBtn" class="btn btn-primary" style="width:100%;">확인 (장비 0강 초기화)</button>
  </div>
</div>

<div class="app">
  <div class="top">
    <div class="brand"><h1>감스트 대장간</h1><p>유비 쌍고검 강화</p></div>
    <div class="balance">회차당 비용: <strong id="costView">100</strong>개 별풍선</div>
  </div>
  <div class="layout">
    <section class="panel forge">
      <div class="weapon-wrap">
        <div class="level" id="level">+0</div>
        <img id="weapon" class="weapon" src="yubi_twin_swords.png" alt="유비 쌍고검">
        <div class="weapon-name">유비 쌍고검</div>
      </div>
      <div class="anvil"></div>
      
      <div class="bottom-panels">
        <div class="sub-panel">
          <h3>📜 강화 기록</h3>
          <div id="history" class="history-list"></div>
        </div>
        <div class="sub-panel">
          <h3>🎁 획득 상품 목록</h3>
          <div id="inventory" class="history-list"></div>
        </div>
      </div>
    </section>

    <aside class="panel controls">
      <h2>대장간 제어판</h2>

      <div class="stat">
        <div class="stat-row"><span>1회 강화 비용 (별풍선 설정)</span></div>
        <div style="margin-top:6px;">
          <input id="costInput" type="number" min="0" value="100">
        </div>
      </div>

      <div class="grid2">
        <button id="enhance1" class="btn btn-primary">🔨 1회 시도 (실패할때까지)</button>
        <button id="enhance10" class="btn btn-primary" style="background:linear-gradient(180deg,#2e8fff,#004ab7);border-color:#6baeff;">⚡ 10회 도전 (실패시 유지)</button>
      </div>
      <div id="result" class="result">강화 버튼을 눌러 시작하세요!</div>

      <div class="stat">
        <div class="stat-row"><span>단계별 확률 및 보상 설정 (직접 수정)</span></div>
        <div class="table-wrap" style="margin-top:6px;">
          <table id="configTable">
            <thead>
              <tr><th>단계</th><th>성공확률(%)</th><th>달성 보상 상품</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <button id="resetAll" class="btn btn-sub" style="background:#4a1515;color:#ff9999;">🔄 장비 초기화 (+0으로)</button>
    </aside>
  </div>
</div>

<script>
const el=id=>document.getElementById(id);
let level=Number(localStorage.getItem('forgeLevel')||0);
let inventory=JSON.parse(localStorage.getItem('forgeInven')||'[]');
let historyLog=JSON.parse(localStorage.getItem('forgeHistory')||'[]');
let busy=false;

// 사용자가 설정한 확률과 보상을 그대로 안전하게 유지하기 위한 기본 틀 (최초 1회만 빈값으로 생성, 이후엔 사용자 수정값 보존)
function getDefaultStages(){
  return Array.from({length:21},(_,i)=>({
    level: i,
    chance: 50,
    reward: '없음'
  }));
}

// 사용자가 우측 표에서 수정한 값들을 온전히 보존하는 로직
let stageConfigs = getDefaultStages();
try{
  const savedStages = JSON.parse(localStorage.getItem('forgeStages_user_fix'));
  if(Array.isArray(savedStages) && savedStages.length === 21){
    stageConfigs = savedStages;
  }
}catch(e){}

const sounds={
  hammer:new Audio('hammer.wav'),
  success:new Audio('success.wav'),
  fail:new Audio('fail.wav'),
  item:new Audio('item.wav')
};

function playSound(name, vol=.7){
  try{
    const s = sounds[name];
    if(s){
      s.pause();
      s.currentTime = 0;
      s.volume = vol;
      s.play().catch(()=>{});
    }
  }catch(e){}
}

function stopSound(name){
  try{
    const s = sounds[name];
    if(s){
      s.pause();
      s.currentTime = 0;
    }
  }catch(e){}
}

function saveAll(){
  localStorage.setItem('forgeLevel',level);
  localStorage.setItem('forgeInven',JSON.stringify(inventory));
  localStorage.setItem('forgeHistory',JSON.stringify(historyLog));
  localStorage.setItem('forgeStages_user_fix',JSON.stringify(stageConfigs));
  localStorage.setItem('forgeCost',el('costInput').value);
}

function renderTable(){
  const tbody=document.querySelector('#configTable tbody');
  tbody.innerHTML='';
  stageConfigs.forEach((cfg,idx)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>+${cfg.level}</td>
      <td><input type="number" min="1" max="100" value="${cfg.chance}" data-idx="${idx}" class="cfg-chance"></td>
      <td><input type="text" value="${cfg.reward}" data-idx="${idx}" class="cfg-reward"></td>
    `;
    tbody.appendChild(tr);
  });
  document.querySelectorAll('.cfg-chance').forEach(input=>{
    input.addEventListener('input',e=>{
      stageConfigs[e.target.dataset.idx].chance=Number(e.target.value)||0;
      saveAll();
    });
  });
  document.querySelectorAll('.cfg-reward').forEach(input=>{
    input.addEventListener('input',e=>{
      stageConfigs[e.target.dataset.idx].reward=e.target.value;
      saveAll();
    });
  });
}

function renderHistory(){
  const h=el('history');
  h.innerHTML=historyLog.map(x=>`<div class="${x.ok?'success-txt':'fail-txt'}">${x.txt}</div>`).join('');
  h.scrollTop=h.scrollHeight;
}

function renderInventory(){
  const inv=el('inventory');
  inv.innerHTML=inventory.length===0 ? '<div style="color:#777;font-size:11px;">획득한 상품이 없습니다.</div>' : inventory.map(x=>`<div>• ${x}</div>`).join('');
  inv.scrollTop=inv.scrollHeight;
}

function refreshUI(){
  el('level').textContent='+'+level;
  el('costView').textContent=el('costInput').value;
  renderHistory();
  renderInventory();
  saveAll();
}

function addHistory(ok,txt){
  const time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  historyLog.push({ok,txt:`[${time}] ${txt}`});
  if(historyLog.length>50) historyLog.shift();
  renderHistory();
}

function emberBurst(count=45){
  const box=el('embers');
  for(let i=0;i<count;i++){
    const e=document.createElement('i'); e.className='ember';
    e.style.left=(45+Math.random()*10)+'%'; e.style.top=(55+Math.random()*12)+'%';
    e.style.animationDuration=(.5+Math.random()*.8)+'s';
    box.appendChild(e); setTimeout(()=>e.remove(),1400);
  }
}

function showRewardModal(msg){
  el('modalMsg').textContent = msg;
  const listEl = el('modalRewardsList');
  listEl.innerHTML = inventory.length === 0 ? '획득한 상품이 없습니다.' : inventory.map(x=>`<div>• ${x}</div>`).join('');
  el('rewardModal').classList.add('active');
}

el('modalConfirmBtn').addEventListener('click', ()=>{
  el('rewardModal').classList.remove('active');
  level = 0;
  refreshUI();
  addHistory(false, '도전 종료 후 장비가 +0단계로 초기화되었습니다.');
});

async function executeStep(isTenMode){
  if(level>=20){
    return { finished: true, success: true, reachedMax: true };
  }

  const currentCfg=stageConfigs[level];
  const old=level;
  const weapon=el('weapon');
  weapon.className='weapon charge';
  el('result').className='result';
  el('result').textContent=`+${old} 단계 강화 중... (확률: ${currentCfg.chance}%)`;
  
  playSound('hammer',.8); 
  emberBurst(55);
  await new Promise(r=>setTimeout(r,600));
  stopSound('hammer');

  const ok=Math.random()*100<currentCfg.chance;

  if(ok){
    level++;
    weapon.className='weapon success';
    el('flash').classList.add('on'); setTimeout(()=>el('flash').classList.remove('on'),700);
    playSound('success',.85);
    setTimeout(()=>stopSound('success'), 900);
    emberBurst(100);

    el('result').textContent=`강화 성공! +${old} → +${level}`;
    el('result').className='result good';
    addHistory(true, `+${old} → +${level} 강화 성공`);

    if(currentCfg.reward && currentCfg.reward!=='없음' && currentCfg.reward.trim()!==''){
      inventory.push(currentCfg.reward);
      playSound('item',.9);
      setTimeout(()=>stopSound('item'), 800);
      addHistory(true, `🎁 상품 획득 (+${old} 달성 보상): ${currentCfg.reward}`);
    }
    refreshUI();
    return { finished: false, success: true };
  }else{
    weapon.className='weapon fail';
    el('shock').classList.add('on'); setTimeout(()=>el('shock').classList.remove('on'),500);
    playSound('fail',.85);
    setTimeout(()=>stopSound('fail'), 700);
    emberBurst(25);

    if(isTenMode){
      el('result').textContent=`강화 실패… (+${old} 단계 유지)`;
      el('result').className='result bad';
      addHistory(false, `+${old} 강화 실패 (단계 유지)`);
      refreshUI();
      return { finished: false, success: false };
    }else{
      el('result').textContent=`강화 실패! 최종 도전 종료.`;
      el('result').className='result bad';
      addHistory(false, `+${old} 강화 실패로 도전 종료`);
      refreshUI();
      return { finished: true, success: false };
    }
  }
}

el('enhance1').addEventListener('click', async()=>{
  if(busy) return;
  busy = true;

  while(true){
    const res = await executeStep(false);
    if(res.finished || res.reachedMax || level >= 20){
      break;
    }
    await new Promise(r=>setTimeout(r,900));
  }

  showRewardModal('실패할 때까지의 도정이 종료되었습니다!');
  busy = false;
});

el('enhance10').addEventListener('click', async()=>{
  if(busy) return;
  busy = true;

  for(let i=0; i<10; i++){
    if(level >= 20) break;
    await executeStep(true);
    await new Promise(r=>setTimeout(r,900));
  }

  showRewardModal('10회 도정이 완료되었습니다!');
  busy = false;
});

el('costInput').addEventListener('input', refreshUI);

el('resetAll').addEventListener('click',()=>{
  if(confirm('정말 장비를 +0단계로 초기화하시겠습니까?')){
    level=0;
    refreshUI();
    addHistory(false, '장비가 +0단계로 초기화되었습니다.');
  }
});

const savedCost = localStorage.getItem('forgeCost');
if(savedCost) el('costInput').value = savedCost;

renderTable();
refreshUI();
</script>
</body>
</html>
