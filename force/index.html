<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감스트 대장간 - 유비 쌍고검 강화</title>
<style>
:root{
  --gold:#f6c453; --gold2:#ff9f1c; --green:#68ff91; --red:#ff4b55;
  --panel:rgba(8,10,14,.90); --line:rgba(246,196,83,.72);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",sans-serif;background:#050505;color:#fff}
body{overflow-x:hidden}
#scene{position:fixed;inset:0;background:url('forge_bg.png') center/cover no-repeat;z-index:-3}
#scene:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 52%,rgba(255,116,20,.2),transparent 28%),
 linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18) 42%,rgba(0,0,0,.58));}
.embers{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff7b00;animation:rise linear forwards}
@keyframes rise{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-260px) scale(.2);opacity:0}}
.app{width:min(1600px,100%);margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand h1{margin:0;font-size:clamp(28px,3.2vw,56px);color:#ffe0a1;text-shadow:0 0 10px #ff9a1f,0 0 28px #7e3500}
.brand p{margin:4px 0 0;color:#d9b873;font-weight:800;letter-spacing:.12em}
.balance{padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.72);font-size:18px;box-shadow:0 0 18px rgba(255,174,50,.2)}
.balance strong{color:#ffd75e;font-size:22px}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(400px,.85fr);gap:18px}
.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(16,18,23,.92),rgba(5,6,9,.94));box-shadow:0 0 0 3px rgba(246,196,83,.08),0 20px 50px rgba(0,0,0,.6),inset 0 0 28px rgba(255,150,25,.04)}
.forge{position:relative;min-height:780px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.weapon-wrap{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(690px,88%);text-align:center}
.level{font-size:clamp(38px,6vw,86px);font-weight:1000;color:#ffd66a;text-shadow:0 0 12px #ff9f1c,0 0 34px #ff5b00;margin-bottom:-28px;position:relative;z-index:5}
.weapon{width:100%;max-height:460px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(99,255,137,.78)) drop-shadow(0 0 32px rgba(255,166,36,.55));transition:.25s}
.weapon.charge{animation:charge .6s ease-in-out infinite}
.weapon.success{animation:success 1s ease-out}
.weapon.fail{animation:fail .8s ease-out}
@keyframes charge{0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(99,255,137,.65))}50%{transform:scale(1.04);filter:brightness(1.35) drop-shadow(0 0 38px #75ff9b) drop-shadow(0 0 58px #ff9f1c)}}
@keyframes success{0%{transform:scale(.9);filter:brightness(4)}45%{transform:scale(1.12);filter:brightness(2.5) drop-shadow(0 0 70px #fff)}100%{transform:scale(1)}}
@keyframes fail{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-2deg);filter:grayscale(.5)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.weapon-name{font-size:26px;font-weight:1000;color:#7dff9c;text-shadow:0 0 12px #178b3d}
.anvil{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:80%;height:110px;background:radial-gradient(ellipse at center,#ff7a00 0%,rgba(255,100,0,.35) 24%,transparent 68%);filter:blur(8px)}
.bottom-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:10;margin-top:auto}
.sub-panel{padding:12px;background:rgba(0,0,0,.75);border:1px solid rgba(246,196,83,.35);border-radius:12px;max-height:160px;overflow:auto}
.sub-panel h3{margin:0 0 6px;color:#ffd37a;font-size:14px}
.history-list{font-family:monospace;font-size:12px;line-height:1.6}
.success-txt{color:#65ff85}.fail-txt{color:#ff6b6b}

.controls{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:82vh;overflow-y:auto}
.controls h2{margin:0;color:#ffd37a;font-size:22px}
.stat{padding:10px;border:1px solid rgba(246,196,83,.28);border-radius:10px;background:rgba(0,0,0,.38)}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.stat-row strong{color:#ffd65d;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.multiplier-box{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}
.multiplier-preview{margin-top:7px;color:#ffd37a;font-size:13px;font-weight:900;text-align:right}
label{font-size:11px;color:#cdbb95;font-weight:800}
input[type=number],select{width:100%;margin-top:3px;padding:8px;border-radius:6px;border:1px solid rgba(246,196,83,.38);background:#0d0f13;color:#fff;font-size:14px}
.btn{padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;text-align:center}
.btn-primary{background:linear-gradient(180deg,#ffb62e,#b75d00);color:#fff6d4;font-size:20px;border:2px solid #ffd66a;box-shadow:0 0 16px rgba(255,160,22,.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sub{background:#222532;color:#ffd37a;border:1px solid #b8860b;font-size:13px}
.table-wrap{max-height:220px;overflow-y:auto;border:1px solid rgba(246,196,83,.25);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
th{background:rgba(246,196,83,.15);color:#ffd37a;position:sticky;top:0}
td input{padding:4px;font-size:12px;text-align:center}
.result{min-height:50px;display:grid;place-items:center;text-align:center;border:1px solid rgba(246,196,83,.25);border-radius:10px;background:rgba(0,0,0,.4);font-size:16px;font-weight:900}
.result.good{color:#79ff9c}
.result.bad{color:#ff7777}

/* 최종 보상 팝업 모달 스타일 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,#1c1e26,#0d0f14);border:3px solid var(--gold);padding:30px;border-radius:20px;width:min(450px,90%);text-align:center;box-shadow:0 0 40px rgba(246,196,83,.4)}
.modal-box h2{color:var(--gold);margin-top:0;font-size:28px}
.modal-box p{font-size:18px;line-height:1.6;margin:20px 0}
.modal-rewards{background:rgba(0,0,0,.5);border:1px solid rgba(246,196,83,.3);border-radius:10px;padding:12px;margin-bottom:20px;max-height:150px;overflow-y:auto;text-align:left;font-size:14px}

.flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
.flash.on{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:1;background:white}22%{opacity:.9;background:#8cff9f}100%{opacity:0;background:transparent}}
.shock{position:fixed;inset:0;pointer-events:none;z-index:49}
.shock.on{animation:shock .45s ease-out}
@keyframes shock{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,3px)}80%{transform:translate(5px,-3px)}}

/* 상품 재고 / 품절 확인 팝업 */
.stock-badge{display:inline-block;min-width:46px;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:900}
.stock-ok{background:rgba(64,200,100,.15);color:#7dff9c;border:1px solid rgba(125,255,156,.45)}
.stock-last{background:rgba(255,190,40,.15);color:#ffd66a;border:1px solid rgba(255,214,106,.55)}
.stock-out{background:rgba(255,75,85,.14);color:#ff7777;border:1px solid rgba(255,119,119,.5)}
.stock-input{width:62px!important}
.stock-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn-yes{background:linear-gradient(180deg,#2dbd63,#15733a);color:#fff;border:1px solid #69e69a}
.btn-no{background:linear-gradient(180deg,#733333,#431818);color:#ffd0d0;border:1px solid #a95353}

@media(max-width:1100px){.layout{grid-template-columns:1fr}.forge{min-height:650px}}
</style>
</head>
<body>
<div id="scene"></div><div class="embers" id="embers"></div><div class="flash" id="flash"></div><div class="shock" id="shock"></div>

<!-- 최종 보상 팝업 모달 -->
<div id="rewardModal" class="modal-overlay">
  <div class="modal-box">
    <h2>🎉 도전 종료 및 보상 정산</h2>
    <p id="modalMsg">도전이 종료되었습니다!</p>
    <div style="font-size:13px;color:#ffd37a;margin-bottom:6px;text-align:left;">획득한 상품 리스트:</div>
    <div id="modalRewardsList" class="modal-rewards"></div>
    <button id="modalConfirmBtn" class="btn btn-primary" style="width:100%;">확인 (장비 0강 초기화)</button>
  </div>
</div>


<!-- 상품 품절 확인 팝업 -->
<div id="stockModal" class="modal-overlay">
  <div class="modal-box">
    <h2>📦 상품 품절 안내</h2>
    <p id="stockModalMsg">상품이 품절되었습니다.</p>
    <div class="stock-modal-actions">
      <button id="stockResetYes" class="btn btn-yes">예 · 초기 수량으로 복원</button>
      <button id="stockResetNo" class="btn btn-no">아니오 · 품절 유지</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="top">
    <div class="brand"><h1>감스트 대장간</h1><p>유비 쌍고검 강화</p></div>
    <div class="balance">회차당 비용: <strong id="costView">100</strong>개 별풍선</div>
  </div>
  <div class="layout">
    <section class="panel forge">
      <div class="weapon-wrap">
        <div class="level" id="level">+0</div>
        <img id="weapon" class="weapon" src="yubi_twin_swords.png" alt="유비 쌍고검">
        <div class="weapon-name">유비 쌍고검</div>
      </div>
      <div class="anvil"></div>
      
      <div class="bottom-panels">
        <div class="sub-panel">
          <h3>📜 강화 기록</h3>
          <div id="history" class="history-list"></div>
        </div>
        <div class="sub-panel">
          <h3>🎁 획득 상품 목록</h3>
          <div id="inventory" class="history-list"></div>
        </div>
      </div>
    </section>

    <aside class="panel controls">
      <h2>대장간 제어판</h2>

      <div class="stat">
        <div class="stat-row"><span>1회 강화 비용 (별풍선 설정)</span></div>
        <div style="margin-top:6px;">
          <input id="costInput" type="number" min="0" value="100">
        </div>
      </div>

      <div class="stat">
        <div class="multiplier-box">
          <div>
            <label for="multiplierInput">도전 코인 수 (실패 가능 횟수)</label>
            <input id="multiplierInput" type="number" min="1" max="100" step="1" value="3">
          </div>
          <button id="applyMultiplier" class="btn btn-sub">X3 적용</button>
        </div>
        <div id="multiplierPreview" class="multiplier-preview">X3 코인 · 실패 3번까지 계속 강화 · 총 비용 300개 별풍선</div>
      </div>

      <div class="grid2">
        <button id="enhance1" class="btn btn-primary">🔨 기본 1회 (실패할 때까지)</button>
        <button id="enhanceMulti" class="btn btn-primary" style="background:linear-gradient(180deg,#2e8fff,#004ab7);border-color:#6baeff;">⚡ X3 코인 도전 (실패 시 1코인 소모)</button>
      </div>
      <div id="result" class="result">강화 버튼을 눌러 시작하세요!</div>

      <div class="stat">
        <div class="stat-row"><span>단계별 확률 및 보상 설정 (직접 수정)</span></div>
        <div class="table-wrap" style="margin-top:6px;">
          <table id="configTable">
            <thead>
              <tr><th>단계</th><th>해당 단계 도달확률(%)</th><th>달성 보상 상품</th><th>초기수량</th><th>재고</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="grid2">
        <button id="resetDefaults" class="btn btn-sub">📋 확률·상품 기본값 복원</button>
        <button id="resetAll" class="btn btn-sub" style="background:#4a1515;color:#ff9999;">🔄 장비 초기화 (+0으로)</button>
      </div>
    </aside>
  </div>
</div>

<script>
const el=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let level=Number(localStorage.getItem('forgeLevel')||0);
let inventory=JSON.parse(localStorage.getItem('forgeInven')||'[]');
let historyLog=JSON.parse(localStorage.getItem('forgeHistory')||'[]');
let busy=false;
let pendingStockLevel=null;

/* 전체 효과음은 요청대로 최대 30% */
const MASTER_VOLUME = 0.30;

function getDefaultStages(){
  return [
    { level:0, chance:100, reward:'이게뭐야', initialStock:null, stock:null },
    { level:1, chance:80, reward:'꽝', initialStock:null, stock:null },
    { level:2, chance:60, reward:'주먹감자', initialStock:null, stock:null },
    { level:3, chance:40, reward:'데스윙크', initialStock:null, stock:null },
    { level:4, chance:20, reward:'거북알', initialStock:null, stock:null },
    { level:5, chance:10, reward:'프사', initialStock:3, stock:3 },
    { level:6, chance:5, reward:'방셀', initialStock:2, stock:2 },
    { level:7, chance:3, reward:'움짤방셀', initialStock:1, stock:1 }
  ];
}

let stageConfigs=getDefaultStages();
try{
  const saved=JSON.parse(localStorage.getItem('forgeStages_stock_v2_reach_chance')||'null');
  if(Array.isArray(saved)&&saved.length){
    stageConfigs=saved.map((cfg,idx)=>{
      const level=Number(cfg.level ?? idx);
      const managed=level>=5;
      const initial=managed?Math.max(0,Number(cfg.initialStock ?? 1)):null;
      const stock=managed?Math.max(0,Number(cfg.stock ?? initial)):null;
      return{
        level,
        chance:Math.max(0,Math.min(100,Number(cfg.chance)||0)),
        reward:String(cfg.reward ?? '없음'),
        initialStock:initial,
        stock
      };
    });
  }
}catch(e){}

const sounds={
  hammer:new Audio('hammer.wav'),
  success:new Audio('success.wav'),
  fail:new Audio('fail.wav'),
  item:new Audio('item.wav')
};

function playSound(name,relative=1){
  try{
    const src=sounds[name];
    if(!src)return null;
    const s=src.cloneNode();
    s.volume=Math.min(1,MASTER_VOLUME*Math.max(0,relative));
    s.play().catch(()=>{});
    return s;
  }catch(e){
    return null;
  }
}

function stopAudio(audio){
  try{
    if(audio){
      audio.pause();
      audio.currentTime=0;
    }
  }catch(e){}
}

function saveAll(){
  localStorage.setItem('forgeLevel',level);
  localStorage.setItem('forgeInven',JSON.stringify(inventory));
  localStorage.setItem('forgeHistory',JSON.stringify(historyLog));
  localStorage.setItem('forgeStages_stock_v2_reach_chance',JSON.stringify(stageConfigs));
  localStorage.setItem('forgeCost',el('costInput').value);
  localStorage.setItem('forgeMultiplier',getMultiplier());
}

function stockBadge(cfg){
  if(cfg.level<5)return '<span style="color:#777">무제한</span>';
  const remain=Math.max(0,Number(cfg.stock)||0);
  const initial=Math.max(0,Number(cfg.initialStock)||0);
  if(remain<=0)return `<span class="stock-badge stock-out">품절 0/${initial}</span>`;
  if(remain===1)return `<span class="stock-badge stock-last">LAST 1/${initial}</span>`;
  return `<span class="stock-badge stock-ok">${remain}/${initial}</span>`;
}

function renderTable(){
  const tbody=document.querySelector('#configTable tbody');
  tbody.innerHTML='';

  stageConfigs.forEach((cfg,idx)=>{
    const managed=cfg.level>=5;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>+${cfg.level}</td>
      <td>${cfg.level===0
        ? '<span style="color:#777">시작</span>'
        : `<input type="number" min="0" max="100" step="0.1" value="${cfg.chance}" data-idx="${idx}" class="cfg-chance">`}
      </td>
      <td><input type="text" value="${escapeHtml(cfg.reward)}" data-idx="${idx}" class="cfg-reward"></td>
      <td>${managed
        ? `<input type="number" min="0" step="1" value="${cfg.initialStock}" data-idx="${idx}" class="cfg-stock stock-input">`
        : '<span style="color:#777">-</span>'}
      </td>
      <td class="stock-cell">${stockBadge(cfg)}</td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('.cfg-chance').forEach(input=>{
    input.addEventListener('input',e=>{
      const idx=Number(e.target.dataset.idx);
      stageConfigs[idx].chance=Math.max(0,Math.min(100,Number(e.target.value)||0));
      saveAll();
    });
  });

  document.querySelectorAll('.cfg-reward').forEach(input=>{
    input.addEventListener('input',e=>{
      const idx=Number(e.target.dataset.idx);
      stageConfigs[idx].reward=e.target.value;
      saveAll();
    });
  });

  document.querySelectorAll('.cfg-stock').forEach(input=>{
    input.addEventListener('change',e=>{
      const idx=Number(e.target.dataset.idx);
      const qty=Math.max(0,parseInt(e.target.value)||0);
      stageConfigs[idx].initialStock=qty;
      stageConfigs[idx].stock=qty;
      renderTable();
      saveAll();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderHistory(){
  const h=el('history');
  h.innerHTML=historyLog.length
    ? historyLog.map(x=>`<div class="${x.ok?'success-txt':'fail-txt'}">${escapeHtml(x.txt)}</div>`).join('')
    : '<div style="color:#777;font-size:11px;">강화 기록이 없습니다.</div>';
  h.scrollTop=h.scrollHeight;
}

function renderInventory(){
  const inv=el('inventory');
  inv.innerHTML=inventory.length===0
    ? '<div style="color:#777;font-size:11px;">획득한 상품이 없습니다.</div>'
    : inventory.map(x=>`<div>• ${escapeHtml(x)}</div>`).join('');
  inv.scrollTop=inv.scrollHeight;
}

function getMultiplier(){
  return Math.max(1,Math.min(100,parseInt(el('multiplierInput')?.value)||1));
}

function updateMultiplierUI(){
  const multi=getMultiplier();
  const cost=Math.max(0,Number(el('costInput').value)||0);
  el('multiplierInput').value=multi;
  el('enhanceMulti').textContent=`⚡ X${multi} 코인 도전 (실패 시 1코인 소모)`;
  el('applyMultiplier').textContent=`X${multi} 적용`;
  el('multiplierPreview').textContent=
    `X${multi} 코인 · 실패 ${multi}번까지 계속 강화 · 총 비용 ${(cost*multi).toLocaleString('ko-KR')}개 별풍선`;
}

function refreshUI(){
  el('level').textContent='+'+level;
  el('costView').textContent=(Number(el('costInput').value)||0).toLocaleString('ko-KR');
  updateMultiplierUI();
  renderHistory();
  renderInventory();
  renderTable();
  saveAll();
}

function addHistory(ok,txt){
  const time=new Date().toLocaleTimeString('ko-KR',{
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  });
  historyLog.push({ok,txt:`[${time}] ${txt}`});
  if(historyLog.length>80)historyLog.shift();
  renderHistory();
}

function emberBurst(count=45){
  const box=el('embers');
  for(let i=0;i<count;i++){
    const e=document.createElement('i');
    e.className='ember';
    e.style.left=(45+Math.random()*10)+'%';
    e.style.top=(55+Math.random()*12)+'%';
    e.style.animationDuration=(.5+Math.random()*.8)+'s';
    box.appendChild(e);
    setTimeout(()=>e.remove(),1400);
  }
}

function openStockModal(levelIndex){
  pendingStockLevel=levelIndex;
  const cfg=stageConfigs[levelIndex];
  el('stockModalMsg').textContent=
    `${levelIndex}단계 보상 상품 '${cfg.reward}'이(가) 품절되었습니다. 상품을 초기화하시겠습니까?`;
  el('stockModal').classList.add('active');
}

el('stockResetYes').addEventListener('click',()=>{
  if(pendingStockLevel!==null){
    const cfg=stageConfigs[pendingStockLevel];
    cfg.stock=Math.max(0,Number(cfg.initialStock)||0);
    addHistory(true,`📦 +${pendingStockLevel} 상품 재고를 ${cfg.stock}개로 초기화`);
    renderTable();
    saveAll();
  }
  pendingStockLevel=null;
  el('stockModal').classList.remove('active');
});

el('stockResetNo').addEventListener('click',()=>{
  if(pendingStockLevel!==null){
    addHistory(false,`📦 +${pendingStockLevel} 상품 품절 상태 유지`);
  }
  pendingStockLevel=null;
  el('stockModal').classList.remove('active');
});

function grantFinalReward(finalLevel,attemptNo){
  const cfg=stageConfigs[finalLevel];
  const reward=cfg?String(cfg.reward||'').trim():'';

  if(!reward||reward==='없음'){
    const item=`${attemptNo}회차 · +${finalLevel} 보상 없음`;
    inventory.push(item);
    addHistory(false,`🎁 ${attemptNo}회차 최종 +${finalLevel}: 보상 없음`);
    renderInventory();
    return item;
  }

  if(finalLevel>=5){
    const remain=Math.max(0,Number(cfg.stock)||0);

    if(remain<=0){
      addHistory(false,`🎁 +${finalLevel} ${reward} 당첨됐지만 이미 품절`);
      openStockModal(finalLevel);
      return null;
    }

    cfg.stock=remain-1;
  }

  const item=`${attemptNo}회차 · +${finalLevel}: ${reward}`;
  inventory.push(item);
  playSound('item',.8);

  if(finalLevel>=5){
    addHistory(true,`🎁 최종 +${finalLevel} 보상: ${reward} · 남은 재고 ${cfg.stock}/${cfg.initialStock}`);
    if(cfg.stock===0){
      renderTable();
      saveAll();
      setTimeout(()=>openStockModal(finalLevel),200);
    }
  }else{
    addHistory(true,`🎁 최종 +${finalLevel} 보상: ${reward}`);
  }

  renderInventory();
  renderTable();
  saveAll();
  return item;
}

function showRewardModal(msg){
  el('modalMsg').textContent=msg;
  el('modalRewardsList').innerHTML=inventory.length===0
    ? '획득한 상품이 없습니다.'
    : inventory.map(x=>`<div>• ${escapeHtml(x)}</div>`).join('');
  el('rewardModal').classList.add('active');
}

el('modalConfirmBtn').addEventListener('click',()=>{
  el('rewardModal').classList.remove('active');
  level=0;
  refreshUI();
});

async function executeStep(isTenMode){
  const maxLevel=stageConfigs.length;
  if(level>=maxLevel)return{finished:true,success:true,reachedMax:true};

  const currentCfg=stageConfigs[level];
  const nextCfg=stageConfigs[level+1];
  if(!currentCfg||!nextCfg)return{finished:true,success:true,reachedMax:true};

  const old=level;
  const weapon=el('weapon');
  weapon.className='weapon charge';
  el('result').className='result';
  el('result').textContent=`+${old} → +${old+1} 강화 중... (+${old+1} 도달확률: ${nextCfg.chance}%)`;

  // 망치음은 긴 원본 전체를 재생하지 않고 강화 모션 동안만 짧게 재생
  const hammerAudio=playSound('hammer',.75);
  emberBurst(55);
  await wait(520);
  stopAudio(hammerAudio);
  await wait(80);

  const ok=Math.random()*100<Number(nextCfg.chance);

  if(ok){
    level++;
    weapon.className='weapon success';
    el('flash').classList.add('on');
    setTimeout(()=>el('flash').classList.remove('on'),700);
    playSound('success',.8);
    emberBurst(100);

    el('result').textContent=`강화 성공! +${old} → +${level}`;
    el('result').className='result good';
    addHistory(true,`+${old} → +${level} 강화 성공`);
    refreshUI();
    return{finished:false,success:true};
  }

  weapon.className='weapon fail';
  el('shock').classList.add('on');
  setTimeout(()=>el('shock').classList.remove('on'),500);
  playSound('fail',.75);
  emberBurst(25);

  if(isTenMode){
    el('result').textContent=`강화 실패… (+${old} 단계 유지)`;
    el('result').className='result bad';
    addHistory(false,`+${old} 강화 실패 · 단계 유지`);
    refreshUI();
    return{finished:false,success:false};
  }

  el('result').textContent='강화 실패! 최종 도전 종료.';
  el('result').className='result bad';
  addHistory(false,`+${old} 강화 실패로 도전 종료`);
  refreshUI();
  return{finished:true,success:false};
}

el('enhance1').addEventListener('click',async()=>{
  if(busy)return;
  busy=true;

  level=0;
  inventory=[];
  historyLog=[];
  refreshUI();

  while(true){
    const res=await executeStep(false);
    if(res.finished||res.reachedMax||level>=stageConfigs.length||!res.success)break;
    await wait(900);
  }

  grantFinalReward(level,1);
  refreshUI();
  showRewardModal(`최종 +${level} 단계 보상만 지급되었습니다.`);
  busy=false;
});

el('enhanceMulti').addEventListener('click',async()=>{
  if(busy)return;
  busy=true;

  const multiplier=getMultiplier();

  // X배율은 총 판정 횟수가 아니라 실패를 버틸 수 있는 코인 수입니다.
  // 성공은 코인을 소모하지 않으며 계속 진행합니다.
  // 실패할 때만 코인 1개가 줄고 현재 강화 단계는 유지됩니다.
  level=0;
  inventory=[];
  historyLog=[];
  refreshUI();

  let remainingCoins=multiplier;
  let totalRolls=0;
  let successCount=0;
  let failCount=0;

  addHistory(true,`━━ X${multiplier} 코인 도전 시작 · 실패 ${multiplier}번까지 유지 ━━`);

  while(remainingCoins>0 && level<stageConfigs.length){
    totalRolls++;
    addHistory(true,`━━ ${totalRolls}번째 강화 판정 · 현재 +${level} · 남은 코인 ${remainingCoins}/${multiplier} ━━`);

    const beforeLevel=level;
    const res=await executeStep(true);

    if(res.reachedMax || level>=stageConfigs.length){
      addHistory(true,'최대 강화 단계에 도달하여 자동 종료');
      break;
    }

    if(res.success){
      successCount++;
      addHistory(true,`성공 · 코인 유지 ${remainingCoins}/${multiplier}`);
    }else{
      failCount++;
      remainingCoins--;
      addHistory(false,`실패 · +${beforeLevel} 유지 · 코인 1개 소모 · 남은 코인 ${remainingCoins}/${multiplier}`);

      if(remainingCoins<=0){
        addHistory(false,'모든 코인을 소모하여 도전 종료');
        break;
      }
    }

    await wait(700);
  }

  grantFinalReward(level,1);
  refreshUI();
  showRewardModal(
    `X${multiplier} 코인 도전 종료 · 총 ${totalRolls}회 판정 (${successCount}성공 / ${failCount}실패) · 최종 +${level} 보상만 지급되었습니다.`
  );
  busy=false;
});
el('costInput').addEventListener('input',refreshUI);
el('multiplierInput').addEventListener('input',()=>{
  updateMultiplierUI();
  saveAll();
});
el('applyMultiplier').addEventListener('click',()=>{
  updateMultiplierUI();
  saveAll();
  el('result').className='result';
  el('result').textContent=`X${getMultiplier()} 코인이 적용되었습니다.`;
});

el('resetDefaults').addEventListener('click',()=>{
  if(confirm('확률·상품·초기 재고를 기본값으로 되돌리시겠습니까?')){
    stageConfigs=getDefaultStages();
    localStorage.removeItem('forgeStages_stock_v2_reach_chance');
    renderTable();
    saveAll();
  }
});

el('resetAll').addEventListener('click',()=>{
  if(confirm('장비 단계, 기록, 획득 상품을 모두 초기화하시겠습니까?')){
    level=0;
    inventory=[];
    historyLog=[];
    refreshUI();
  }
});

const savedCost=localStorage.getItem('forgeCost');
if(savedCost)el('costInput').value=savedCost;

const savedMultiplier=localStorage.getItem('forgeMultiplier');
if(savedMultiplier)el('multiplierInput').value=
  Math.max(1,Math.min(100,parseInt(savedMultiplier)||3));

renderTable();
refreshUI();
</script>
